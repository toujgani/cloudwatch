# Cloud AI Monitor — CI/CD Pipeline
# Builds Docker image, pushes to GHCR, deploys to OpenShift Developer Sandbox
name: Build & Deploy to OpenShift

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloud-ai-monitor
  IMAGE_TAG: ${{ github.sha }}
  OPENSHIFT_NAMESPACE: red1intheocean-dev

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OpenShift
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Deploy PostgreSQL (if not exists)
        run: |
          set +e
          oc get deployment postgresql -n ${{ env.OPENSHIFT_NAMESPACE }} > /dev/null 2>&1
          PG_EXISTS=$?
          set -e
          if [ $PG_EXISTS -ne 0 ]; then
            echo "PostgreSQL not found — deploying..."
            oc apply -f openshift/secrets.yaml -n ${{ env.OPENSHIFT_NAMESPACE }}
            oc apply -f openshift/postgresql.yaml -n ${{ env.OPENSHIFT_NAMESPACE }}
            echo "Waiting for PostgreSQL to be ready..."
            oc rollout status deployment/postgresql -n ${{ env.OPENSHIFT_NAMESPACE }} --timeout=120s || \
              echo "PostgreSQL rollout still in progress — continuing anyway."
          else
            echo "PostgreSQL already deployed — skipping."
          fi

      - name: Apply ConfigMap and Secrets
        run: |
          oc apply -f openshift/configmap.yaml -n ${{ env.OPENSHIFT_NAMESPACE }}
          set +e
          oc get secret cloudwatch-secrets -n ${{ env.OPENSHIFT_NAMESPACE }} > /dev/null 2>&1
          SECRET_EXISTS=$?
          set -e
          if [ $SECRET_EXISTS -ne 0 ]; then
            echo "Applying secrets for the first time..."
            oc apply -f openshift/secrets.yaml -n ${{ env.OPENSHIFT_NAMESPACE }}
          else
            echo "Secrets already exist — updating..."
            oc apply -f openshift/secrets.yaml -n ${{ env.OPENSHIFT_NAMESPACE }}
          fi

      - name: Deploy Application
        run: |
          oc scale deployment/postgresql --replicas=1 -n ${{ env.OPENSHIFT_NAMESPACE }} || true
          oc apply -f openshift/deployment.yaml -n ${{ env.OPENSHIFT_NAMESPACE }}
          oc set image deployment/cloud-ai-monitor \
            cloud-ai-monitor=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.OPENSHIFT_NAMESPACE }}
          oc scale deployment/cloud-ai-monitor --replicas=1 -n ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Wait for rollout
        run: |
          oc rollout status deployment/cloud-ai-monitor \
            -n ${{ env.OPENSHIFT_NAMESPACE }} \
            --timeout=300s || echo "Rollout still in progress — pod may need more time on sandbox."

      - name: Get Application URL
        if: always()
        run: |
          ROUTE=$(oc get route cloud-ai-monitor -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "route-not-found")
          if [ "$ROUTE" != "route-not-found" ] && [ -n "$ROUTE" ]; then
            echo "Application deployed at: https://${ROUTE}"
          else
            echo "Route not found — may need to be created manually with: oc expose service cloud-ai-monitor"
          fi
