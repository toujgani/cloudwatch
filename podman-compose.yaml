# Cloud AI Monitor — Podman Production Deployment
# Deploy: podman-compose up -d
# Stop:   podman-compose down
version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: cloudwatch-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudwatch}
      POSTGRES_USER: ${POSTGRES_USER:-cloudwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudwatch"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/toujgani/cloud-ai-monitor:latest
    container_name: cloudwatch-app
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
