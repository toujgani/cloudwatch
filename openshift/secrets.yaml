  namespace: red1intheocean-dev
  labels:
    app.kubernetes.io/name: cloud-ai-monitor
    app.kubernetes.io/component: config
type: Opaque
stringData:
  # PostgreSQL (password must match postgresql-secret below)
  DATABASE_URL: "postgresql://cloudwatch:CloudW4tch2026!Secure@postgresql:5432/cloudwatch"

  # JWT signing key
  SECRET_KEY: "c9m4x7pRqT2vB8nL5wK1jF6hA3dY0sG4eU9iZoX2bN7mQ8rW1t"

