# Cloud AI Monitor — ConfigMap (non-sensitive configuration)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudwatch-config
  namespace: red1intheocean-dev
  labels:
    app.kubernetes.io/name: cloud-ai-monitor
    app.kubernetes.io/component: config
data:
  # OpenStack (empty = skip collection, no DNS errors)
  OS_AUTH_URL: "http://10.230.0.199:5000/v3"
  OS_USERNAME: "unoc"
  OS_PASSWORD: "@@Cires@@--_!"
  OS_PROJECT_NAME: "admin"
  OS_USER_DOMAIN_NAME: "Default"
  OS_PROJECT_DOMAIN_NAME: "Default"

  # OpenShift / Kubernetes
  KUBE_API_URL: "https://kubernetes.default.svc"
  KUBE_VERIFY_SSL: "false"
  KUBE_NAMESPACE: "red1intheocean-dev"

  # Collector
  COLLECT_INTERVAL_SECONDS: "30"

  # Mock mode (true = fake data for demos)
  MOCK_OPENSTACK: "true"
  MOCK_OPENSHIFT: "false"

  # Alert thresholds
  ALERT_CPU_WARNING: "70"
  ALERT_CPU_CRITICAL: "90"
  ALERT_RAM_WARNING: "75"
  ALERT_RAM_CRITICAL: "90"

  # Email (enabled — sends alerts when AI acts)
  EMAIL_ALERTS_ENABLED: "true"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "farouktoujgani@gmail.com"
  SMTP_FROM: "Cloud AI Monitor <farouktoujgani@gmail.com>"
  ALERT_EMAIL_TO: "farouktoujgani@gmail.com"
  SMTP_USE_TLS: "true"

  # Grafana
  GRAFANA_URL: "http://localhost:3000"
  GRAFANA_METRICS_DATASOURCE_UID: "grafanacloud-prom"
  GRAFANA_LOGS_DATASOURCE_UID: "grafanacloud-logs"
  GRAFANA_TRACES_DATASOURCE_UID: "grafanacloud-traces"
  GRAFANA_VERIFY_SSL: "true"

  # Financial
  FINANCE_MONTHLY_INFRA_COST: "10000"
  FINANCE_AUTOMATION_SAVINGS_RATE: "0.12"

  # AI Remediation (LIVE MODE — AI will execute actions)
  AUTO_REMEDIATION_ENABLED: "true"
  AUTO_REMEDIATION_DRY_RUN: "false"
  AUTO_REMEDIATION_MIN_SCORE: "40"
  REMEDIATION_STORAGE_INCREMENT_GB: "20"
  REMEDIATION_MEMORY_SCALE_PERCENT: "25"
  REMEDIATION_MAX_ACTIONS_PER_HOUR: "5"
  REMEDIATION_MAX_STORAGE_GB: "500"
  REMEDIATION_MEMORY_FLAVOR_MAP: "{}"
  REMEDIATION_VM_RECOVERY_ACTION: "hard_reboot"
  REMEDIATION_K8S_SAFE_NAMESPACES: "red1intheocean-dev"

  # Soft Quota (percentage of actual sandbox quota to use as operating limit)
  SOFT_QUOTA_CPU_PERCENT: "90"
  SOFT_QUOTA_RAM_PERCENT: "90"
  QUOTA_THRESHOLD_WARNING: "80"
  QUOTA_THRESHOLD_CRITICAL: "90"
  QUOTA_THRESHOLD_REMEDIATE: "95"

  # Seed passwords (only used on first boot when DB is empty)
  SEED_PASSWORD_ADMIN: "Admin@CloudAI2026"
  SEED_PASSWORD_OPERATOR: "Operator@CloudAI2026"
  SEED_PASSWORD_VIEWER: "Viewer@CloudAI2026"
